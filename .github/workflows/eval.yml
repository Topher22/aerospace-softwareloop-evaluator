name: SIL Aerospace Harness Evaluation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-eval-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Build Tools & Coverage Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ lcov

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile C++17 SUT Binary with Coverage Flags
        run: |
          mkdir -p bin
          # Compile with -fprofile-arcs -ftest-coverage
          g++ -std=c++17 -O0 --coverage src/sut_controller.cpp -o bin/sut_controller
          chmod +x bin/sut_controller

      - name: Run SIL Evaluation Suite
        run: |
          mkdir -p reports
          python main.py --sut ./bin/sut_controller --tests ./scenarios --output-xml reports/junit.xml
          # Verify .gcda trace files were created
          echo "Listing generated .gcda files:"
          find . -name "*.gcda"

      - name: Generate Coverage Report
        run: |
          mkdir -p coverage/html

          # 1. Capture raw coverage traces
          lcov --capture --directory . --output-file coverage/coverage.info \
            --ignore-errors empty,mismatch

          # 2. Filter out standard library & system headers
          lcov --remove coverage/coverage.info '/usr/*' \
            --output-file coverage/coverage_filtered.info \
            --ignore-errors unused,empty

          # 3. Print terminal summary to GHA log
          lcov --list coverage/coverage_filtered.info

          # 4. Generate browsable HTML report
          genhtml coverage/coverage_filtered.info \
            --output-directory coverage/html \
            --ignore-errors unused,empty

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "devops-eval-harness/reports/junit.xml"

      - name: Upload JUnit XML Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: devops-eval-harness/reports/junit.xml

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxx-coverage-report
          path: devops-eval-harness/coverage/html