name: SIL Aerospace Harness Evaluation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: devops-eval-harness

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Build Tools & Coverage Utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ lcov

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile C++17 SUT Binary with Coverage Flags
        run: |
          mkdir -p bin
          # --coverage generates .gcno notes during compilation
          g++ -std=c++17 -O0 --coverage src/sut_controller.cpp -o bin/sut_controller
          chmod +x bin/sut_controller

      - name: Run SIL Evaluation Suite
        run: |
          mkdir -p reports
          # Running the harness produces .gcda runtime trace files
          python main.py --sut ./bin/sut_controller --tests ./scenarios --output-xml reports/junit.xml

      - name: Generate Coverage Report
        run: |
          mkdir -p coverage/html

          # Capture raw coverage metrics from the working tree
          lcov --capture --directory . --output-file coverage/coverage.info

          # Filter out standard library, system headers, and external dependencies
          lcov --remove coverage/coverage.info '/usr/*' '*/include/*' --output-file coverage/coverage_filtered.info

          # Print terminal summary
          lcov --list coverage/coverage_filtered.info

          # Generate static browsable HTML pages
          genhtml coverage/coverage_filtered.info --output-directory coverage/html

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: "devops-eval-harness/reports/junit.xml"

      - name: Upload JUnit XML Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-report
          path: devops-eval-harness/reports/junit.xml

      - name: Upload HTML Coverage Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cxx-coverage-report
          path: devops-eval-harness/coverage/html